name: Process
on:
  # weekly on Mondays at 00:00 UTC (08:00 CST) - direct-crawl batch
  # (replaces the collect.py airport run: airport registration is dead,
  # 0 airports found; process.py crawls Telegram/GitHub public subs instead)
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  # time zone
  TZ: Asia/Shanghai

  # process.py config file, committed in this repo (no secrets inside:
  # public Gist id + public subscription URLs + public Telegram channels)
  SUBSCRIBE_CONF: subscribe/config.json

  # token used to push results to the Gist (same PAT as the collect run)
  PUSH_TOKEN: ${{ secrets.GIST_PAT }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode: 0 = crawl + aggregate
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include special protocols, such as vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        run: python -u subscribe/process.py --overwrite

      - name: Timestamp
        run: date
